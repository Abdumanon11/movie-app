<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/media.css">
    <title>🎬 Movie App</title>
</head>

<body>
    <header>
        <h1>Movie App 🎬</h1>
    </header>
    <main>
        <section class="movie-container">
            <div class="search-box">
                <select name="genre-filter" id="genre-filter"></select>
                <select name="sort" id="sort-filter">
                    <option value="all">Все фильмы</option>
                    <option value="rating-asc">Рейтинг ↑</option>
                    <option value="rating-desc">Рейтинг ↓</option>
                    <option value="title-asc">Название А–Я</option>
                    <option value="title-desc">Название Я–А</option>
                </select>
                <input type="text" placeholder="Введите фильм">
                <button>🔍</button>
                <a href="favorites.html" class="favorites-btn">❤️ Избранное</a>
            </div>

            <div class="loader hidden">
                Загрузка...
            </div>
            <p class="search-error"></p>

            <div class="movies-grid"></div>
            <button class="load-more-btn">Загрузить ещё</button>

        </section>
    </main>
    <div class="box-modal">
        <div class="modal">
            <div class="modal-backdrop"></div>
            <button class="close-modal">✖</button>
            <img class="modal-poster" src="" alt="Постер фильма">
            <div class="box-modal-info">
                <p class="modal-loading">Загрузка...</p>
                <h1 class="modal-title"></h1>
                <p class="modal-slogan"></p>
                <div class="box-modal-date">
                    <p class="modal-vote-average"></p>
                    <p class="modal-release-date"></p>
                    <p class="modal-runtime"></p>
                </div>
                <div class="modal-genres">
                    <p class="modal-genre"></p>
                </div>
                <p class="modal-overview"></p>
                <p class="modal-director"></p>
                <div class="modal-cast"></div>
            </div>
        </div>
    </div>


    <script type="module" src="js/app.js"></script>
</body>

</html>
